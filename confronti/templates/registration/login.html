{% extends "confronti/base.html" %}

{% block title %}Accedi - Energia Solidale{% endblock %}

{% block content %}
<section class="panel narrow">
    <h1>Accedi</h1>
    {% if form.errors %}
        <p class="error">Credenziali non valide.</p>
    {% endif %}
    <form method="post" class="form-grid one">
        {% csrf_token %}
        <label>
            Email o username
            {{ form.username }}
        </label>
        <label>
            Password
            {{ form.password }}
        </label>
        <button type="submit">Accedi</button>
    </form>
</section>
{% endblock %}
